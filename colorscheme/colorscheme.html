<!doctype html>
<html lang="uk">
    <head>
        <title>Color scheme assignment</title>
        <style>
            table,
            tr,
            td,
            th {
                border: 1px solid black;
            }
            table img {
                width: 75%;
            }
        </style>
    </head>

    <body>
        <table>
            <caption>
                <img src="colorsheme.jpg" />
            </caption>

            <tbody>
                <tr>
                    <th colspan="4">Spiral</th>
                </tr>
                <tr>
                    <td style="background-color: #6aa800; color: black">Apple Green</td>
                    <td style="background-color: #e40002; color: black">Red</td>
                    <td style="background-color: rgba(5, 1, 78,0.9); color: black">Deep Navy Blue</td>
                    <td style="background-color: #eab006; color: black">Gold</td>
                </tr>

                <tr>
                    <td>#6AA800</td>
                    <td>#e40002</td>
                    <td>#05014e</td>
                    <td>#eab006</td>
                </tr>

                <tr>
                    <td>rgb(106, 168, 0)</td>
                    <td>rgb(228, 0, 2)</td>
                    <td>rgb(5, 1, 78)</td>
                    <td>rgb(234, 176, 6)</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td>hsl(82, 100%, 33%)</td>
                    <td>hsl(359, 100%, 45%)</td>
                    <td>hsl(243, 97%, 15%)</td>
                    <td>hsl(45, 95%, 47%)</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
